limit_req_zone $binary_remote_addr zone=issue_submit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 5m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        return 302 /ogrenci-ariza;
    }

    location = /ogrenci-ariza {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /ariza-bildir.html =404;
    }

    location = /style.css {
        try_files /style.css =404;
    }

    location = /ariza-bildir.js {
        try_files /ariza-bildir.js =404;
    }

    location = /api/arizalar {
        limit_except POST { deny all; }
        limit_req zone=issue_submit burst=3 nodelay;
        proxy_pass http://backend:3000/api/arizalar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
