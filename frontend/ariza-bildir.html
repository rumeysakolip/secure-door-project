<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arıza Bildir | QR Mobil</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js?v=20260728-1" defer></script>
</head>
<body data-page="issue-report">
  <main class="standalone-page">
    <div class="standalone-brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <div><strong>SecureLab</strong><small>Teknik Destek Merkezi</small></div>
    </div>

    <div class="mobile-card">
      <article class="card-box">
        <header class="ticket-header">
          <span class="ticket-header-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a4 4 0 0 0-5-5L7 4l3 3 2.7-2.7a4 4 0 0 0 2 2Z"/><path d="m5 8-3 3 10 10 3-3M14 16l6-6 2 2-6 6"/></svg></span>
          <div class="eyebrow">Yeni destek kaydı</div>
          <h1 class="page-title">Sistem Arıza Bildirimi</h1>
          <p class="page-description">Kapı, kart okuyucu veya diğer donanımlarla ilgili sorunu teknik ekibe iletin.</p>
        </header>

        <form class="ticket-form" id="issue-report-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="report-full-name">Ad Soyad</label>
              <input id="report-full-name" type="text" class="form-control" maxlength="80" placeholder="Örn: Ahmet Yılmaz" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="report-email">E-posta Adresi</label>
              <div class="email-input-group">
                <input id="report-email" type="text" maxlength="40" placeholder="kullanici.adi" required>
                <span class="email-domain">@subu.edu.tr</span>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="report-issue-type">Arıza Türü</label>
            <select id="report-issue-type" name="issueType" class="form-control" required>
              <option value="">Arıza türü seçin</option>
              <option value="Kapı">Kapı</option>
              <option value="RFID okuyucu">RFID okuyucu</option>
              <option value="Tuş takımı">Tuş takımı</option>
              <option value="Bağlantı">Bağlantı</option>
              <option value="Diğer">Diğer</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Arıza Fotoğrafı Yükle / Çek</label>
            <input type="file" id="filePicker" accept="image/*" hidden onchange="updateFileName(this)">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden onchange="updateFileName(this)">
            <div class="file-input-box">
              <label for="filePicker" class="file-text" id="fileNameText">Dosya seçmek için tıklayın</label>
              <label for="cameraInput" class="camera-btn" title="Kamerayı aç" aria-label="Kamerayı aç">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.5 4 16 7h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4l1.5-3h5Z"/><circle cx="12" cy="13" r="3"/></svg>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="report-description">Açıklama</label>
            <textarea id="report-description" name="description" class="form-control" rows="4" maxlength="512" placeholder="Sorunun nerede ve nasıl oluştuğunu açıklayın..." required></textarea>
          </div>

          <div class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            <span>Gönderdiğiniz bilgiler yalnızca teknik inceleme amacıyla kullanılacaktır.</span>
          </div>

          <div id="issue-report-message" class="form-message" role="status" aria-live="polite"></div>

          <button type="submit" class="btn-primary" id="issue-report-submit" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            Bildirimi Gönder
          </button>
        </form>
      </article>
    </div>
  </main>

</body>
</html>
