<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Öğrenci Arıza Bildirimi QR Kodu | SecureLab</title>
  <link rel="stylesheet" href="style.css?v=20260807-4">
  <script src="qr-kod.js?v=20260807-4" defer></script>
</head>
<body class="qr-page">
  <main class="qr-sheet">
    <div class="qr-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>SecureLab Teknik Destek</span></div>
    <h1>Arıza mı var?</h1>
    <p>Telefon kameranızla QR kodu okutun ve öğrenci arıza bildirim formunu doldurun.</p>

    <div id="qr-loading" class="qr-loading" role="status">QR kod hazırlanıyor…</div>
    <img class="qr-image" id="qr-image" alt="Öğrenci arıza bildirim formu QR kodu" hidden>
    <a class="qr-url" id="qr-url" href="/ogrenci-ariza" target="_blank" rel="noopener">Adres hazırlanıyor…</a>
    <div class="form-message form-message-warning" id="qr-network-warning" role="status" hidden></div>

    <form class="qr-address-form" id="qr-address-form">
      <label for="qr-address-input">Telefonların erişebileceği form adresi</label>
      <div class="qr-address-controls">
        <input class="form-control" id="qr-address-input" type="url" inputmode="url" placeholder="https://destek.example.edu.tr/ogrenci-ariza" required>
        <button class="btn-secondary" type="submit">QR’ı Güncelle</button>
      </div>
      <small>Alan adı yoksa bilgisayarın yerel ağ adresini kullanın; <strong>localhost</strong> telefonda çalışmaz.</small>
    </form>

    <div class="qr-actions">
      <button type="button" class="btn-primary" id="qr-print-button">QR Kodunu Yazdır</button>
      <button type="button" class="btn-secondary" id="qr-copy-button">Adresi Kopyala</button>
      <a class="btn-secondary" id="qr-open-button" href="/ogrenci-ariza" target="_blank" rel="noopener">Formu Aç</a>
    </div>
  </main>
</body>
</html>
