services:
  db:
    image: postgres:16
    container_name: kapi-sistemi-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - kapi-network

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: kapi-sistemi-mqtt

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

    restart: unless-stopped

    networks:
      - kapi-network

  backend:
    build:
      context: ./backend

    container_name: kapi-sistemi-backend

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      PORT: 3000
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: 1883

    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

    restart: unless-stopped

    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

    networks:
      - kapi-network

  frontend:
    build:
      context: ./frontend

    container_name: kapi-sistemi-frontend

    ports:
      - "8080:80"

    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - kapi-network

volumes:
  postgres_data:

networks:
  kapi-network:
    driver: bridge
  