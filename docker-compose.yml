services:
  db:
    image: postgres:16
    container_name: kapi-sistemi-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - kapi-network

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: kapi-sistemi-mqtt

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./mosquitto:/mosquitto/config

    restart: unless-stopped

    networks:
      - kapi-network

  backend:
    build:
      context: ./backend

    container_name: kapi-sistemi-backend

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      PORT: 3000
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: 1883
      JWT_SECRET: ${JWT_SECRET:-securelab-local-jwt-change-this}
      ESP32_SECRET_KEY: ${ESP32_SECRET_KEY:-securelab-device-development-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ALLOW_DEV_PASSWORD_RESET: ${ALLOW_DEV_PASSWORD_RESET:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Istanbul}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-123456}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-123456}

    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

    networks:
      - kapi-network

  frontend:
    build:
      context: ./frontend

    container_name: kapi-sistemi-frontend

    ports:
      - "8080:80"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - kapi-network

volumes:
  postgres_data:

networks:
  kapi-network:
    driver: bridge
